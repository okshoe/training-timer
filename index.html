<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motion Loop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div class="title-row">
        <h1>Motion Loop</h1>
        <button id="open-settings" type="button" aria-label="設定を開く" aria-haspopup="dialog">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="m9 3 1-2h4l1 2 2 1 2-.2 2 3.4-1.2 1.8v3l1.2 1.8-2 3.4-2-.2-2 1-1 2h-4l-1-2-2-1-2 .2-2-3.4 1.2-1.8v-3L3 7.2l2-3.4 2 .2Z" transform="translate(0 1)"/><circle cx="12" cy="12" r="3.3"/></svg>
        </button>
      </div>
      <div class="session-info">
        <p id="status">開始前</p>
        <p id="round">1 / 2周</p>
      </div>
    </header>
    <img id="exercise-image" src="assets/squat.svg" alt="" width="240" height="240">
    <h2 id="exercise">最初は、スクワット</h2>
    <div class="timer-ring" id="timer-ring">
      <div class="timer-face"><span class="timer-label">残り時間</span><span id="time">10</span><span class="timer-unit">秒</span></div>
    </div>

    <button id="start" type="button">スタート</button>
    <div class="secondary-actions">
      <button id="pause" type="button">一時停止</button>
      <button id="reset" type="button">リセット</button>
    </div>
    <p class="session-note" id="session-note"></p>
  </main>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <div class="dialog-header">
      <h2 id="settings-title">設定</h2>
      <button id="close-settings" type="button" aria-label="設定を閉じる" autofocus>×</button>
    </div>
    <div class="settings">
      <div class="choices" role="group" aria-label="トレーニングと休憩の秒数">
        <button type="button" data-training="30" aria-pressed="false">30:30</button>
        <button type="button" data-training="40" aria-pressed="true">40:20</button>
      </div>
      <div class="choices" role="group" aria-label="周回数">
        <button type="button" data-rounds="2" aria-pressed="true">2周</button>
        <button type="button" data-rounds="3" aria-pressed="false">3周</button>
      </div>
      <div class="choices" role="group" aria-label="イラスト">
        <button type="button" data-illustration="male" aria-pressed="true">男性</button>
        <button type="button" data-illustration="female" aria-pressed="false">女性</button>
      </div>
    </div>
    <ul id="exercise-list" aria-label="種目の選択と順番"></ul>
    <p class="settings-help" id="settings-help">設定は自動で保存されます。</p>
  </dialog>
  <script src="script.js"></script>
</body>
</html>
