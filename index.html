<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>トレーニングタイマー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>トレーニングタイマー</h1>
    <p id="round">1周目 / 2周</p>
    <p id="status">開始前</p>
    <img id="exercise-image" src="assets/squat.svg" alt="" width="240" height="240">
    <h2 id="exercise">スクワット</h2>
    <p><span id="time">40</span>秒</p>

    <button id="start" type="button">スタート</button>
    <button id="pause" type="button">一時停止</button>
    <button id="reset" type="button">リセット</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
